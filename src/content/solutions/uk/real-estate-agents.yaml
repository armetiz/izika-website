featureHighlights:
  title: The simplest way for agents to manage their mileage allowances
  image:
    src: /assets/verticals/real-estate-agents/next-stop.uk.png
    alt: izika for real estate agents
    title: izika for real estate agents
  ctaText: Try izika
  items:
    - title: No more paper notes and forgotten trips
      text: >-
        Between viewings, valuations, signings and prospecting, it is easy to forget a trip.
        izika analyses your appointments and automatically computes the distances and the amount of your allowances.
    - title: No more year-end patching
      text: >-
        Agents often spend hours reconstructing their trips.
        With izika, everything is already ready when you need it.
    - title: No more rough estimates
      text: >-
        No more back-of-the-envelope calculations. izika applies the right mileage scale and computes
        your allowances for you.
    - title: Guaranteed compliance
      text: >-
        izika is approved and validated by chartered accountants and the tax administration.
        The generated reports comply with your tax obligations.

benefits:
  title: "Benefits of a trip management tool for real estate agents"
  items:
    - title: Your trips reconstructed from your appointments
      image: /assets/verticals/real-estate-agents/calendar-to-mileage.uk.png
      imageAlt: izika - real estate agents' trips reconstructed from their appointments
      text: |
        <p>Between a valuation in the morning, three viewings in the afternoon and a signing at the end of the day, your trips pile up fast.</p>
        <p>izika automatically picks up your appointments as they come and generates your trips without any manual entry:</p>
        <ul>
          <li>Every appointment or round becomes a trip ready to report</li>
          <li>No more forgotten journeys</li>
          <li>No manual calculation to do</li>
          <li>Automatic calculation based on your vehicle</li>
        </ul>
    - title: A clear tax report for your professional obligations
      image: /assets/verticals/real-estate-agents/report.uk.png
      imageAlt: "izika - a clear tax report for the tax administration"
      text: |
        <p>Whether for your annual return or for your accountant, everything is already structured: kilometres, trips, amounts, vehicle tax ratings.</p>
        <p>izika lets you:</p>
        <ul>
          <li>Hand a professional document to your accountant for your annual accounts</li>
          <li>Stay compliant with tax obligations without second-guessing</li>
          <li>Justify your trips in the event of a tax audit</li>
        </ul>
    - title: A solution that doesn't weigh down your day
      image: /assets/photos/laptop-app.uk.jpg
      imageAlt: izika - a solution that doesn't weigh down real estate agents' days
      text: |
        <p>You don't need to use izika continuously: your trips are recorded from your appointments, and you generate your report whenever you need it.</p>
        <p>Busy periods (spring, back-to-school, viewing peaks) make administrative tasks even heavier. izika relieves you exactly then: everything is already recorded.</p>
        <p><strong>Designed for your life in the field:</strong></p>
        <ul>
          <li>No complex application to manage</li>
          <li>No double entry</li>
          <li>No new routine to adopt</li>
          <li>A reliable tool when reporting time comes</li>
        </ul>
  testimonial:
    quote: >-
      izika saves me several hours a month. I never miss a trip anymore, everything is automatic.
    avatar: /assets/verticals/real-estate-agents/portrait-testimonial.jpg
    avatarAlt: Julie M.
    name: Julie M.
    companyTitle: Independent real estate agent

