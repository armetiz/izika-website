    quote: >-
      I used to write my trips down in a notebook that I systematically left in my car.
      At year-end, I would spend hours reconstructing it all with my accountant — and we were never sure we had everything.
      With izika, that's over. My Google calendar is synced, and when my accountant needs the report, it's ready in five minutes.
