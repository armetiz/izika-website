benefits:
  title: "Benefits of a mileage allowance management tool for independent professionals"
  items:
    - title: Your trips generated automatically from your appointments
      image: /assets/solutions/professions-liberales/calendar-to-ik.png
      imageAlt: "izika - Independent professionals' mileage allowances computed from the calendar"
      text: |
        <p>Your schedule revolves around consultations, home visits and practice meetings. All journeys you have no time to write down one by one.</p>
        <ul>
          <li>Sync your business calendar once</li>
          <li>Every appointment or visit automatically becomes a computed journey</li>
          <li>Distances and amounts are already there, with no entry on your part</li>
        </ul>
    - title: A compliant tax report for your income tax return
      image: /assets/solutions/professions-liberales/rapport-print-ombre.png
      imageAlt: izika - A compliant tax report for independent professionals' income tax returns
      text: |
        <p>
          As an independent professional, your travel expenses must be substantiated, including for your income tax return.
          izika generates a structured, clear document accepted by the tax administration.
        </p>
        <ul>
          <li>Export a complete report in a few clicks</li>
          <li>Send it straight to your chartered accountant</li>
          <li>Justify every trip in the event of a tax audit</li>
        </ul>
    - title: "You don't have to manage izika day to day"
      image: /assets/solutions/laptop-screen-izika.jpg
      imageAlt: "izika - You don't have to manage izika day to day"
      text: |
        <p>izika doesn't ask you to log in every day or enter a single trip. It works in the background, from your calendar.</p>
        <ul>
          <li>No manual entry, no logbook to keep</li>
          <li>No double bookkeeping with your existing calendar tool</li>
          <li>Open izika whenever you need it — everything is already ready</li>
        </ul>
  testimonial:
    quote: >-
      Between my home visits and my consultations at the practice, I no longer had time to write anything
      down. izika does it for me, and my accountant receives a detailed mileage report at year-end.
    avatar: /assets/solutions/testimonial-avatar.png
    avatarAlt: Nathalie R.
    name: Nathalie R.
    companyTitle: Independent nurse

customerCase:
  title: Is izika the best tool for managing independent professionals' trips?
  intro: |
    <p>
      Sophie, an independent physiotherapist, splits her time between her practice and home visits.
      Since she started using izika, her calendar does the work for her — and she sends her report to her accountant in a few minutes.
    </p>
