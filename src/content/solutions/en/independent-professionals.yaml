  avatarAlt: Sophie L.
  gainsTitle: "Here is what Sophie gained by using izika:"
  gains:
    - image: /assets/landing-pages/icon_cal-to-rdv.png
      imageAlt: "Trips generated automatically from the calendar"
      text: >-
        All her home visits and her journeys between the practice and her patients
        <strong>are automatically turned into mileage allowances</strong> with no manual entry.
    - image: /assets/landing-pages/illu-tournee-etoile.png
