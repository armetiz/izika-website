      text: >-
        Sophie set up her <strong>usual rounds</strong> in izika.
        At the end of the week she quickly reviews her trips in a few seconds and fixes anything needed before exporting.
    - image: /assets/landing-pages/icon_report-conformity.png
      imageAlt: Guaranteed tax compliance
      text: >-
        <strong>No stress in the event of a tax audit.</strong>
        Her izika report is clear and structured, and every trip is substantiated by the matching calendar entry.
