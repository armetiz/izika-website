featureHighlights:
  title: La méthode la plus rapide pour les professions libérales pour gérer leurs déplacements
  image:
    src: /assets/solutions/visuel-agenda-professionnel.png
    alt: izika pour les professions libérales
    title: izika pour les professions libérales
  ctaText: Tester izika
  items:
    - title: Chaque déplacement est automatiquement capturé
      text: izika analyse vos rendez-vous et calcule distances et montants. Aucune saisie.
    - title: "Fini la reconstitution en fin d'exercice"
      text: >-
        Vos données sont déjà là quand votre comptable en a besoin. Rien à reconstituer, rien à chercher.
    - title: Terminé les approximations et les oublis
      text: >-
        izika applique le bon barème en fonction de votre véhicule et de votre puissance fiscale.
        Chaque trajet est comptabilisé, même les plus routiniers.
    - title: Conformité garantie
      text: >-
        izika est approuvé et validé par les experts-comptables et l'administration. Les rapports générés
        sont conformes à vos obligations fiscales et à votre déclaration BNC.

benefits:
  title: "Avantages d'un outil de gestion des IK pour les professions libérales"
  items:
    - title: Vos déplacements générés automatiquement à partir de vos rendez-vous
      image: /assets/solutions/professions-liberales/calendar-to-ik.png
      imageAlt: "izika - Indemnités kilométriques pour les professions libérales calculées à partir de l'agenda"
      text: |
        <p>Votre planning est rythmé par des consultations, des visites à domicile, des réunions de cabinet. Autant de déplacements que vous n'avez pas le temps de noter un par un.</p>
        <ul>
          <li>Synchronisez votre agenda professionnel une seule fois</li>
          <li>Chaque rendez-vous ou visite devient automatiquement un trajet calculé</li>
          <li>Les distances et les montants sont déjà là, sans aucune saisie de votre part</li>
        </ul>
    - title: Un rapport fiscal conforme pour votre déclaration BNC
      image: /assets/solutions/professions-liberales/rapport-print-ombre.png
      imageAlt: izika - Un rapport fiscal conforme pour la déclaration BNC des professions libérales
      text: |
        <p>
          Sous régime BNC, vos frais de déplacements doivent être justifiés y compris pour votre déclaration 2035.
          izika génère un document structuré, clair et accepté par l'administration.
        </p>
        <ul>
          <li>Exportez un rapport complet en quelques clics</li>
          <li>Transmettez-le directement à votre expert-comptable</li>
          <li>Justifiez chaque déplacement en cas de contrôle fiscal</li>
        </ul>
    - title: "Vous n'avez pas à gérer izika au quotidien"
      image: /assets/solutions/laptop-screen-izika.jpg
      imageAlt: "izika - Vous n'avez pas à gérer izika au quotidien"
      text: |
        <p>izika ne vous demande pas de vous connecter chaque jour ni de saisir le moindre trajet. Il travaille en arrière plan, à partir de votre agenda.</p>
        <ul>
          <li>Pas de saisie manuelle, pas de carnet de bord à tenir</li>
          <li>Pas de double gestion avec votre outil d'agenda existant</li>
          <li>Ouvrez izika quand vous en avez besoin, tout est déjà prêt</li>
        </ul>
  testimonial:
    quote: >-
      Entre mes visites à domicile et mes consultations au cabinet, je n'avais plus le temps de noter quoi
      que ce soit. izika le fait pour moi, et mon comptable reçoit un relevé d'IK détaillé en fin d'année.
    avatar: /assets/solutions/testimonial-avatar.png
    avatarAlt: Nathalie R.
    name: Nathalie R.
    companyTitle: Infirmière libérale

