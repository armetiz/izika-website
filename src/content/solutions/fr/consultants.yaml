featureHighlights:
  title: La méthode la plus rapide pour les consultants pour gérer leurs déplacements clients
  image:
    src: /assets/solutions/visuel-agenda-professionnel.png
    alt: izika pour les consultants indépendants
    title: izika pour les consultants indépendants
  ctaText: Tester izika
  items:
    - title: Votre agenda fait le travail à votre place
      text: >-
        Chaque rendez-vous client, chaque déplacement en mission devient automatiquement un trajet calculé.
        Vous continuez à gérer votre agenda comme d'habitude — izika s'en occupe.
    - title: "Aucune reconstitution en fin d'exercice"
      text: >-
        Vos données sont déjà là quand votre comptable en a besoin. Fini les tableurs, les carnets de bord
        et les heures perdues à retrouver des trajets oubliés.
    - title: Le bon barème appliqué automatiquement
      text: >-
        izika applique le barème fiscal correspondant à votre véhicule et à votre puissance fiscale.
        Chaque kilomètre est comptabilisé au bon tarif, sans calcul de votre part.
    - title: Conformité garantie
      text: >-
        izika est approuvé et validé par les experts-comptables et l'administration. Les rapports générés
        sont conformes à vos obligations fiscales, quelle que soit votre structure (EI, SASU, EURL…).

benefits:
  title: "Avantages d'un outil de gestion des IK pour les consultants"
  items:
    - title: Vos déplacements clients calculés automatiquement depuis votre agenda
      image: /assets/solutions/consultants/calendar-to-ik.png
      imageAlt: "izika - Indemnités kilométriques pour consultants calculées à partir de l'agenda"
      text: |
        <p>En tant que consultant, vos journées s'enchaînent entre des réunions chez vos clients, des déplacements en mission, des visites de prospection… Autant de trajets que vous n'avez pas le temps de noter un par un.</p>
        <ul>
          <li>Synchronisez votre agenda professionnel une seule fois</li>
          <li>Chaque rendez-vous devient automatiquement un trajet calculé</li>
          <li>Les distances et les montants d'indemnités sont déjà là, sans aucune saisie</li>
        </ul>
    - title: Un rapport fiscal conforme, prêt à envoyer à votre comptable
      image: /assets/solutions/consultants/rapport-print-ombre.png
      imageAlt: izika - Rapport fiscal conforme pour les consultants indépendants
      text: |
        <p>
          Que vous soyez en EI, SASU ou EURL, vos frais de déplacements doivent être justifiés.
          izika génère un document structuré, clair et accepté par l'administration fiscale.
        </p>
        <ul>
          <li>Exportez un rapport complet en quelques clics</li>
          <li>Transmettez-le directement à votre expert-comptable</li>
          <li>Justifiez chaque déplacement en cas de contrôle fiscal</li>
        </ul>
    - title: izika tourne en arrière-plan, sans charge mentale
      image: /assets/solutions/laptop-screen-izika.jpg
      imageAlt: izika - Gestion des IK consultants sans charge quotidienne
      text: |
        <p>izika ne vous demande pas de vous connecter chaque jour ni de saisir le moindre trajet. Il travaille en arrière-plan, à partir de votre agenda.</p>
        <ul>
          <li>Pas de saisie manuelle, pas de carnet de bord</li>
          <li>Pas de double gestion avec votre outil d'agenda existant</li>
          <li>Ouvrez izika quand vous en avez besoin — tout est déjà prêt</li>
        </ul>
  testimonial:
    quote: >-
      Je me déplace énormément : clients, prospects, partenaires. Avant izika, je notais vaguement dans un coin
      et je reconstituais en fin d'année avec mon comptable. Maintenant tout est déjà là.
      Je gagne au minimum deux heures par mois.
    avatar: /assets/solutions/testimonial-avatar.png
    avatarAlt: Thomas V.
    name: Thomas V.
    companyTitle: "Consultant en systèmes d'information"

customerCase:
  title: izika est-il le meilleur outil pour gérer les trajets des consultants indépendants ?
  intro: |
    <p>
      Joseph Darves est expert en réparation et conseil en instruments à vent — clarinettes, saxophones, flûtes, hautbois, bassons.
      Il opère depuis deux adresses : son atelier à Quincy-sous-Sénart et sa boutique parisienne dans le 17e arrondissement.
    </p>
    <p>
      Il se déplace régulièrement chez des partenaires, des écoles de musique et des orchestres pour des expertises sur place.
      Client izika premium depuis 2023, il ne perd plus une minute sur ses indemnités kilométriques.
    </p>
  avatar: /assets/solutions/persona.jpg
  avatarAlt: Joseph Darves - JD Atelier des Bois
  gainsTitle: "Voici ce que Joseph a gagné en utilisant izika :"
  gains:
    - image: /assets/landing-pages/icon_cal-to-rdv.png
      imageAlt: Trajets entre les deux adresses calculés automatiquement
      text: >-
        Ses allers-retours entre Quincy-sous-Sénart et Paris, ses visites chez des partenaires et des écoles de musique
        <strong>sont automatiquement transformés en indemnités kilométriques</strong> sans aucune saisie.
    - image: /assets/landing-pages/illu-tournee-etoile.png
      imageAlt: Expertises et consultations en déplacement
      text: >-
        Chaque expertise sur place, chaque rendez-vous conseil chez un client devient automatiquement un trajet dans izika.
        Joseph vérifie ses <strong>déplacements en quelques secondes</strong> et corrige si besoin avant d'exporter.
    - image: /assets/landing-pages/icon_report-conformity.png
      imageAlt: Rapport annuel transmis au comptable en quelques minutes
      text: >-
        En fin d'exercice, <strong>le rapport est prêt en cinq minutes.</strong>
        Joseph le transmet directement à son comptable — chaque trajet est justifié et conforme, sans stress en cas de contrôle.
  testimonial:
    quote: >-
      J'ai deux adresses et je me déplace beaucoup — chez des partenaires, des écoles, des orchestres.
      Avant izika, je ne savais plus trop quoi déclarer en fin d'année. Maintenant mon agenda fait tout le travail.
      Je n'ai quasiment rien à faire, et mon comptable reçoit un rapport complet en quelques minutes.
    name: Joseph Darves
    companyTitle: JD Atelier des Bois — Expert en instruments à vent
  ctaBlock:
    text: "Comme Joseph, arrêtez de perdre du temps sur vos déclarations d'IK"
    buttonText: Tester gratuitement
