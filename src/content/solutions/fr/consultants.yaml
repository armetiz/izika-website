meta:
  title: "Gestion des IK pour les consultants indépendants - izika"
  description: "izika est la solution idéale pour les consultants indépendants qui se déplacent chez leurs clients : calcul automatique des IK depuis votre agenda, sans saisie."
trackingContext: page_solution_consultants

head:
  title1: Outil de gestion de trajets pour les consultants
  title2: Gestion automatique des IK pour les consultants indépendants
  catch: >-
    izika transforme vos rendez-vous clients en indemnités kilométriques.
    Aucune saisie, aucun oubli, un rapport prêt pour votre comptable.
  secondaryCta:
    routeKey: features
